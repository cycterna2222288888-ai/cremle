<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Kremlin Voices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap');
  :root { --ink:#080808; --paper:#ede8dc; --red:#8b1a1a; --light-gray:#bab3a0; --rule:#1c1c1c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif; font-weight:300; min-height:100vh; display:flex; flex-direction:column; }
  .topbar { border-bottom:1px solid var(--rule); padding:16px 60px; display:flex; justify-content:space-between; align-items:center; font-size:10px; letter-spacing:0.25em; text-transform:uppercase; color:var(--red); }
  .topbar a { color:var(--red); text-decoration:none; }
  .topbar a:hover { color:var(--paper); }
  .lang-switch { display:flex; border:1px solid #333; overflow:hidden; }
  .lang-switch a { font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:#888; text-decoration:none; padding:6px 12px; transition:all 0.2s; }
  .lang-switch a.active { color:var(--paper); background:#1c1c1c; }
  .body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px; }
  .code { font-family:'Playfair Display',serif; font-size:clamp(6rem,20vw,12rem); color:#111; line-height:1; margin-bottom:8px; }
  .label { font-size:10px; letter-spacing:0.3em; text-transform:uppercase; color:var(--red); margin-bottom:24px; }
  h1 { font-family:'Playfair Display',serif; font-size:clamp(1.4rem,4vw,2.2rem); font-weight:400; margin-bottom:16px; }
  p { color:var(--light-gray); max-width:420px; font-size:15px; margin-bottom:40px; }
  .back { color:var(--paper); text-decoration:none; font-size:11px; letter-spacing:0.25em; text-transform:uppercase; border-bottom:1px solid var(--red); padding-bottom:2px; }
  .back:hover { color:var(--red); }
  @media(max-width:768px) { .topbar { padding:14px 20px; } }
</style>
<meta property="og:image" content="https://cycterna2222288888-ai.github.io/cremle/og-image.svg">
<meta name="twitter:image" content="https://cycterna2222288888-ai.github.io/cremle/og-image.svg">
<link rel="alternate" hreflang="ru" href="https://cycterna2222288888-ai.github.io/cremle/404.html">
<link rel="alternate" hreflang="en" href="https://cycterna2222288888-ai.github.io/cremle/404-en.html">

<style id="light-mode-css" media="(prefers-color-scheme:light)">
  /* Injected by theme toggle — applied when data-theme="light" */
</style>
<style>
[data-theme="light"] {
  --ink: #f2ede3;
  --paper: #111;
  --light-gray: #4a4a4a;
  --rule: #ccc5b5;
  --card-bg: #e8e3d8;
}
[data-theme="light"] body { background: #f2ede3; color: #111; }
[data-theme="light"] .topbar { background: #f2ede3; border-color: #ccc5b5; }
[data-theme="light"] .card { background: #e8e3d8; border-color: #ccc5b5; }
[data-theme="light"] .card-name { color: #111; }
[data-theme="light"] .card-role { color: #4a4a4a; }
[data-theme="light"] .quote-card { background: #e8e3d8; border-color: #ccc5b5; }
[data-theme="light"] .quote-text { color: #111; }
[data-theme="light"] .section { border-color: #ccc5b5; }
[data-theme="light"] .masthead { border-color: #ccc5b5; }
[data-theme="light"] .timeline-year { border-color: #ccc5b5; }
[data-theme="light"] .hero-left { background: #f2ede3; }
[data-theme="light"] .hero-right { background: #d8d3c8; }
[data-theme="light"] .sanctions-table th { background: #e0dbd0; }
[data-theme="light"] .sanctions-table td { border-color: #ccc5b5; }
[data-theme="light"] .sanctions-table tr:hover td { background: #e8e3d8; }
[data-theme="light"] .source-card { background: #e8e3d8; border-color: #ccc5b5; }
[data-theme="light"] .footer { border-color: #ccc5b5; color: #888; }
[data-theme="light"] .nav-back { background: #f2ede3; border-color: #ccc5b5; }
[data-theme="light"] #progress-bar { background: #8b1a1a; }
</style>
<style>
/* Light mode text readability fixes */
[data-theme="light"] .lang-switch a.active { background: #d8d3c8; color: #111; }
[data-theme="light"] .lang-switch a:hover { background: #ccc5b5; color: #111; }
[data-theme="light"] .search-wrap input { background: #fff; border-color: #ccc5b5; color: #111; }
[data-theme="light"] .card:hover { background: #d8d3c8; }
[data-theme="light"] .next-dosye:hover { background: #e8e3d8; }
[data-theme="light"] .related-card:hover { background: #d8d3c8; }
[data-theme="light"] .person-quote { background: #e8e3d8; }
[data-theme="light"] .meme-card { background: #e8e3d8; }
</style>
</head>
<body>

<nav class="topbar"><button id="theme-toggle" onclick="(function(){var t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);document.getElementById('theme-toggle').title=t==='light'?'Switch to dark':'Switch to light';})()" title="Switch to light" style="background:none;border:1px solid #333;color:#888;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;padding:5px 10px;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s" onmouseover="this.style.color='var(--paper)'" onmouseout="this.style.color='#888'">☀ Light</button>
  <a href="index-en.html">← Kremlin Voices</a>
  <div class="lang-switch">
    <a href="404.html">RU</a>
    <a href="404-en.html" class="active">EN</a>
  </div>
</nav>

<div class="body">
  <div class="code">404</div>
  <div class="label">Page not found</div>
  <h1>This dossier doesn't exist</h1>
  <p>The page you're looking for has been removed, renamed, or never existed.</p>
  <a href="index-en.html" class="back">← Back to the archive</a>
</div>

<script>
(function(){
  var t=localStorage.getItem('theme')||'dark';
  document.documentElement.dataset.theme=t;
  var btn=document.getElementById('theme-toggle');
  if(btn){btn.textContent=t==='light'?'☽ Dark':'☀ Light';btn.title=t==='light'?'Switch to dark':'Switch to light';}
})();
</script>
</body>
</html>
