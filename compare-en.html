function compare() {
  var aKey = document.getElementById('person-a').value;
  var bKey = document.getElementById('person-b').value;

  if (!aKey || !bKey) {
    alert('Please select both people');
    return;
  }
  if (aKey === bKey) {
    alert('Please select different people');
    return;
  }

  var a = data[aKey];
  var b = data[bKey];

  var html = '';

  function row(label, va, vb, cls) {
    cls = cls || '';
    return '<div class="cg-label">' + label + '</div>' +
           '<div class="cg-cell ' + cls + '">' + va + '</div>' +
           '<div class="cg-cell ' + cls + '">' + vb + '</div>';
  }

  function sanctions(arr) {
    return arr.map(function(s){ return '<span class="sanction-tag">' + s + '</span>'; }).join(' ');
  }

  html += '<div class="compare-section"><div class="compare-section-title">Основные данные</div>';
  html += '<div class="compare-grid">';
  html += '<div class="cg-label"></div><a class="cg-head" href="' + a.dosye + '" style="text-decoration:none;color:var(--paper)">' + a.name + ' ↗</a><a class="cg-head" href="' + b.dosye + '" style="text-decoration:none;color:var(--paper)">' + b.name + ' ↗</a>';
  html += row('Born', a.born, b.born, 'highlight');
  html += row('Channel / Platform', a.channel, b.channel);
  html += row('Show / Role', a.show, b.show);
  html += '</div></div>';

  html += '<div class="compare-section"><div class="compare-section-title">Санкции</div>';
  html += '<div class="compare-grid">';
  html += '<div class="cg-label"></div><div class="cg-head">' + a.name + '</div><div class="cg-head">' + b.name + '</div>';
  html += row('Imposed', sanctions(a.sanctions), sanctions(b.sanctions));
  html += row('Special Restrictions', a.property, b.property);
  html += '</div></div>';

  html += '<div class="compare-section"><div class="compare-section-title">Метод и стиль</div>';
  html += '<div class="compare-grid">';
  html += '<div class="cg-label"></div><div class="cg-head">' + a.name + '</div><div class="cg-head">' + b.name + '</div>';
  html += row('Method', a.method, b.method);
  html += '</div></div>';

  html += '<div class="compare-section"><div class="compare-section-title">Характерные цитаты</div>';
  html += '<div class="compare-grid">';
  html += '<div class="cg-label"></div><div class="cg-head">' + a.name + '</div><div class="cg-head">' + b.name + '</div>';
  html += '<div class="cg-label">' + a.year + ' / ' + b.year + '</div>';
  html += '<div class="cg-cell"><div class="quote-cell">' + a.quote + '</div></div>';
  html += '<div class="cg-cell"><div class="quote-cell">' + b.quote + '</div></div>';
  html += '</div></div>';

  document.getElementById('result').innerHTML = html;
  document.getElementById('result').style.display = 'block';
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
}
</script>
