[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[template.environment]
  NODE_VERSION = "18"

# Custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
